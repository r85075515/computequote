    <!-- Theme pre-paint (2026-11-05): set data-theme before first paint so
         dark-mode users never see a light flash. Mirrors lib/theme.ts. -->
    <script>
      (function () {
        try {
          var t = new URLSearchParams(window.location.search).get('theme')
          if (t !== 'light' && t !== 'dark') t = localStorage.getItem('cq_theme')
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.dataset.theme = t
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
